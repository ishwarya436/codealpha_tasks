
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="music-container">

        <header>
            <h1>♫ Music Player</h1>
            <p>Your music, your mood</p>
        </header>

        <!-- Music Player -->
        <div class="player-card">

            <div class="album-container">
                <img
                    src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=500"
                    id="albumImage"
                    alt="Album Cover"
                >
            </div>

            <div class="song-details">
                <h2 id="songTitle">Song Title</h2>
                <p id="artistName">Artist Name</p>
            </div>

            <!-- Audio Element -->
            <audio id="audioPlayer"></audio>

            <!-- Progress Bar -->
            <div class="progress-container">

                <span id="currentTime">0:00</span>

                <input
                    type="range"
                    id="progressBar"
                    value="0"
                    min="0"
                    max="100"
                >

                <span id="duration">0:00</span>

            </div>

            <!-- Music Controls -->
            <div class="controls">

                <button id="previousBtn" title="Previous">
                    ⏮
                </button>

                <button id="playPauseBtn" class="play-btn" title="Play">
                    ▶
                </button>

                <button id="nextBtn" title="Next">
                    ⏭
                </button>

            </div>

            <!-- Volume Control -->
            <div class="volume-container">

                <label for="volumeControl">🔊 Volume</label>

                <input
                    type="range"
                    id="volumeControl"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.7"
                >

            </div>

            <!-- Autoplay -->
            <div class="autoplay-container">

                <input type="checkbox" id="autoplayToggle">

                <label for="autoplayToggle">
                    Autoplay next song
                </label>

            </div>

        </div>

        <!-- Playlist -->
        <div class="playlist-container">

            <h2>My Playlist</h2>

            <ul id="playlist"></ul>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
