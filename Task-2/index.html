
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator-container">

        <!-- Header -->
        <header>
            <h1>Smart Calculator</h1>
            <p>Calculate everything easily</p>
        </header>

        <!-- Calculator -->
        <div class="calculator">

            <!-- Display Screen -->
            <div class="display">

                <div id="expression" class="expression">
                    0
                </div>

                <div class="result-label">
                    Result
                </div>

                <div id="result" class="result">
                    0
                </div>

            </div>

            <!-- Calculator Buttons -->
            <div class="buttons">

                <button class="clear" data-action="clear">
                    AC
                </button>

                <button class="delete" data-action="delete">
                    DEL
                </button>

                <button class="operator" data-value="/">
                    ÷
                </button>

                <button class="operator" data-value="*">
                    ×
                </button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>

                <button class="operator" data-value="-">
                    -
                </button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>

                <button class="operator" data-value="+">
                    +
                </button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>

                <button class="equal" data-action="calculate">
                    =
                </button>

                <button data-value="0" class="zero">
                    0
                </button>

                <button data-value=".">.</button>

            </div>

        </div>

        <p class="footer">
            Designed with HTML, CSS & JavaScript
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
